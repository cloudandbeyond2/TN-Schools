<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="threadG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgG3)"/>

  <!-- Wooden Table with Rags -->
  <rect x="300" y="500" width="1000" height="250" rx="20" fill="#451a03" stroke="#78350f" stroke-width="8"/>
  
  <!-- Scattered Silk Thread Rags -->
  <path d="M400 520 Q480 480 520 540 T600 520" stroke="#e11d48" stroke-width="12" fill="none"/>
  <path d="M650 540 Q750 490 820 570 T900 530" stroke="#f59e0b" stroke-width="14" fill="none"/>
  <path d="M950 510 Q1050 560 1120 500 T1200 550" stroke="#0284c7" stroke-width="10" fill="none"/>
  <circle cx="780" cy="540" r="45" fill="url(#threadG)" opacity="0.8"/>
  <circle cx="550" cy="560" r="35" fill="url(#threadG)" opacity="0.8"/>

  <!-- Thiruvalluvar's Calm Demeanor Glow -->
  <circle cx="800" cy="300" r="160" fill="#fbbf24" opacity="0.2"/>
  <circle cx="800" cy="220" r="50" fill="#d97706"/>
  <path d="M750 230 Q800 350 850 230 Q800 310 750 230 Z" fill="#ffffff"/>
  <circle cx="800" cy="160" r="28" fill="#ffffff"/>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.9"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 3: Value of Labor</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">கந்தலான போதும் கோபப்படாமல் உழைப்பின் மதிப்பைக் கற்பித்தல்</text>
</svg>
