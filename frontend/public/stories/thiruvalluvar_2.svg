<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0813"/>
      <stop offset="50%" stop-color="#4a1226"/>
      <stop offset="100%" stop-color="#120409"/>
    </linearGradient>
    <linearGradient id="silkG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Wall & Atmosphere -->
  <rect width="1600" height="900" fill="url(#bgG)"/>
  
  <!-- Ancient Pillars -->
  <rect x="80" y="0" width="100" height="900" fill="#2d151e" opacity="0.6"/>
  <rect x="1420" y="0" width="100" height="900" fill="#2d151e" opacity="0.6"/>

  <!-- Oil Lamp Flame Glow -->
  <circle cx="250" cy="450" r="180" fill="#f59e0b" opacity="0.15"/>
  <path d="M250 400 L255 440 Q250 460 245 440 Z" fill="#fbbf24"/>

  <!-- Thiruvalluvar Seated peacefully (Left) -->
  <g transform="translate(250, 300)">
    <!-- Aura -->
    <circle cx="120" cy="120" r="140" fill="#f59e0b" opacity="0.1"/>
    <!-- Head & Beard -->
    <circle cx="120" cy="80" r="45" fill="#d97706"/>
    <path d="M75 90 Q120 200 165 90 Q120 160 75 90 Z" fill="#f8fafc"/>
    <circle cx="120" cy="30" r="25" fill="#f8fafc"/> <!-- Hair bun -->
    <!-- White Robe -->
    <path d="M40 180 Q120 140 200 180 L230 380 Q120 400 10 380 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Arrogant Youth (Right) Holding Torn Saree -->
  <g transform="translate(950, 220)">
    <!-- Youth Head -->
    <circle cx="150" cy="90" r="40" fill="#b45309"/>
    <!-- Torso -->
    <path d="M80 160 Q150 130 220 160 L240 380 Q150 400 60 380 Z" fill="#0284c7"/>
    <!-- Arms stretched tearing fabric -->
    <path d="M80 170 L-40 220" stroke="#b45309" stroke-width="28" stroke-linecap="round"/>
    <path d="M220 170 L340 220" stroke="#b45309" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Torn Silk Saree Halves -->
  <g transform="translate(680, 420)">
    <!-- Left Half Saree -->
    <path d="M-100 0 C-40 30, -60 100, -140 150 C-180 180, -20 220, 20 120 Z" fill="url(#silkG)"/>
    <path d="M-100 0 L-80 15" stroke="url(#goldG)" stroke-width="12"/>

    <!-- Tearing Jagged Edge Crack -->
    <path d="M20 120 L40 100 L25 140 L50 160 L30 190" stroke="#ef4444" stroke-width="6" fill="none"/>

    <!-- Right Half Saree -->
    <path d="M60 110 C120 40, 160 80, 240 130 C280 160, 180 230, 80 170 Z" fill="url(#silkG)"/>
    <path d="M240 130 L220 145" stroke="url(#goldG)" stroke-width="12"/>
  </g>

  <!-- Title Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#090305" opacity="0.9"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 2: The Arrogant Test</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">வள்ளுவரை சோதிக்க பட்டுச் சேலையைக் கிழிக்கும் இளைஞன்</text>
</svg>
