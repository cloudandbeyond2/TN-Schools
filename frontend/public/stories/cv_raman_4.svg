<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRaman4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldNobel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRaman4)"/>

  <!-- Golden Rays radiating from Nobel Medal -->
  <circle cx="800" cy="380" r="300" fill="#f59e0b" opacity="0.15"/>
  
  <!-- Nobel Medal -->
  <g transform="translate(800, 380)">
    <circle cx="0" cy="0" r="160" fill="url(#goldNobel)" stroke="#fef08a" stroke-width="8" shadow="0 0 40px #f59e0b"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#78350f" stroke-width="4"/>
    <text x="0" y="-30" font-family="serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">NOBEL PRIZE</text>
    <text x="0" y="20" font-family="serif" font-size="36" font-weight="bold" fill="#451a03" text-anchor="middle">PHYSICS 1930</text>
    <text x="0" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">SIR C.V. RAMAN</text>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 4: Nobel Prize &amp; National Science Day</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">1930-ல் இயற்பியலுக்கான நோபல் பரிசு பெற்று இந்தியாவிற்குப் பெருமை சேர்த்தல்</text>
</svg>
