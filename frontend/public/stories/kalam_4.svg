<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKal4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgKal4)"/>

  <!-- Sunset Horizon & Sun -->
  <circle cx="800" cy="450" r="160" fill="#fef08a" opacity="0.9"/>
  <rect x="0" y="450" width="1600" height="330" fill="#18181b"/>

  <!-- Father & Son Silhouettes looking up -->
  <g transform="translate(700, 360)">
    <!-- Father -->
    <circle cx="60" cy="40" r="30" fill="#09090b"/>
    <path d="M20 90 Q60 70 100 90 L110 240 H10 Z" fill="#09090b"/>
    <!-- Son Kalam -->
    <circle cx="160" cy="80" r="22" fill="#09090b"/>
    <path d="M130 120 Q160 105 190 120 L195 240 H125 Z" fill="#09090b"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 4: Father's Immortal Wisdom</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#fde047" text-anchor="middle">'விழுந்தவர்களைத் தூக்கி நிறுத்துவதே பெருமை' எனும் தந்தையின் போதனை</text>
</svg>
