<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgG4)"/>

  <!-- Golden Palm Leaf Manuscript (Thirukkural) Glowing -->
  <g transform="translate(600, 200)">
    <rect x="0" y="0" width="400" height="120" rx="15" fill="#f59e0b" stroke="#fef08a" stroke-width="6" shadow="0 0 30px #f59e0b"/>
    <path d="M40 40 L360 40 M40 60 L360 60 M40 80 L280 80" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <!-- Radiating Aura -->
    <circle cx="200" cy="60" r="220" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Kneeling Young Man Submitting Ego -->
  <g transform="translate(680, 400)">
    <!-- Joined Palms (Anjali Mudra) -->
    <path d="M120 180 L120 100 Q120 90 110 90 Q100 90 100 100 L100 180 Z" fill="#b45309"/>
    <circle cx="110" cy="60" r="35" fill="#b45309"/> <!-- Head bowing -->
    <path d="M40 220 C80 160, 140 160, 180 220 L160 360 C110 370, 70 370, 20 360 Z" fill="#0369a1"/>
  </g>

  <!-- Title Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#022c22" opacity="0.9"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 4: Transformation of Heart</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#34d399" text-anchor="middle">அகந்தையை விடுத்து திருக்குறளின் பொறையுடைமையைக் கற்றல்</text>
</svg>
