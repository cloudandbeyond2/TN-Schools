<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgKal1)"/>

  <!-- Rain Drops & Coastal Palm Trees -->
  <line x1="200" y1="50" x2="150" y2="250" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>
  <line x1="500" y1="100" x2="450" y2="300" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>
  <line x1="800" y1="30" x2="750" y2="230" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>
  <line x1="1100" y1="80" x2="1050" y2="280" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>
  <line x1="1400" y1="120" x2="1350" y2="320" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>

  <!-- Young Kalam & Injured Sparrow in Mud -->
  <g transform="translate(680, 320)">
    <!-- Shivering Sparrow -->
    <path d="M120 180 C80 140, 160 120, 180 170 C190 200, 150 210, 120 180 Z" fill="#b45309"/>
    <circle cx="165" cy="155" r="14" fill="#78350f"/>
    <!-- Wet Mud Ground -->
    <ellipse cx="140" cy="220" rx="200" ry="40" fill="#291206"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 1: Rainy Afternoon &amp; Fallen Bird</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#2dd4bf" text-anchor="middle">மழைக்குப் பின் சேற்றில் அடிபட்டு நடுங்கும் சிட்டுக்குருவியைச் சிறுவன் கலாம் காண்பது</text>
</svg>
