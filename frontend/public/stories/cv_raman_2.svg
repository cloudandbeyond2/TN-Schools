<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRaman2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRaman2)"/>

  <!-- Starry Sky -->
  <circle cx="200" cy="100" r="3" fill="#ffffff"/>
  <circle cx="450" cy="150" r="2" fill="#ffffff"/>
  <circle cx="800" cy="80" r="4" fill="#ffffff"/>
  <circle cx="1200" cy="140" r="3" fill="#ffffff"/>
  <circle cx="1450" cy="90" r="2" fill="#ffffff"/>

  <!-- Ship Deck Railings (Foreground) -->
  <rect x="0" y="550" width="1600" height="40" fill="#334155"/>
  <line x1="200" y1="550" x2="200" y2="780" stroke="#475569" stroke-width="12"/>
  <line x1="600" y1="550" x2="600" y2="780" stroke="#475569" stroke-width="12"/>
  <line x1="1000" y1="550" x2="1000" y2="780" stroke="#475569" stroke-width="12"/>
  <line x1="1400" y1="550" x2="1400" y2="780" stroke="#475569" stroke-width="12"/>

  <!-- Deep Blue Ocean Waves -->
  <path d="M0 600 Q400 560 800 600 T1600 600 L1600 900 L0 900 Z" fill="#0284c7" opacity="0.7"/>
  <path d="M0 650 Q400 610 800 650 T1600 650 L1600 900 L0 900 Z" fill="#0369a1" opacity="0.8"/>

  <!-- C.V. Raman Scientist looking through Spectroscope -->
  <g transform="translate(680, 250)">
    <!-- Turban & Face -->
    <circle cx="140" cy="90" r="45" fill="#f59e0b"/>
    <path d="M90 60 Q140 10 190 60 Q140 30 90 60 Z" fill="#ffffff"/> <!-- White Turban -->
    <path d="M80 160 Q140 130 200 160 L220 380 Q140 400 60 380 Z" fill="#0f172a"/>
    <!-- Spectroscope instrument -->
    <rect x="180" y="100" width="160" height="24" rx="6" fill="#fbbf24" transform="rotate(-15 180 100)"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 2: Voyage Across the Ocean</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#38bdf8" text-anchor="middle">1921-ல் மத்திய தரைக்கடல் பயணத்தில் ஆழ்கடலின் நீல நிறத்தை ஆராய்தல்</text>
</svg>
