<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPan2)"/>

  <!-- Clever Jackal Creeping through Jungle Leaves -->
  <g transform="translate(680, 280)">
    <!-- Full Moon -->
    <circle cx="120" cy="-60" r="70" fill="#fef08a" opacity="0.8"/>
    <!-- Jackal Body -->
    <path d="M40 180 Q120 120 200 180 Q240 240 160 300 H40 Z" fill="#d97706"/>
    <!-- Jackal Snout & Ears -->
    <polygon points="200,160 260,190 200,210" fill="#d97706"/>
    <polygon points="170,120 190,160 160,160" fill="#b45309"/>
    <!-- Leaves -->
    <path d="M-40 200 Q40 100 100 240 Z" fill="#22c55e" opacity="0.8"/>
    <path d="M220 220 Q300 120 340 260 Z" fill="#15803d" opacity="0.8"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 2: Courage Over Fear</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#4ade80" text-anchor="middle">பயந்து ஓடாமல் ஒலியின் உண்மையான மூலத்தை ஆராயப் புத்திசாலி நரி துணிதல்</text>
</svg>
