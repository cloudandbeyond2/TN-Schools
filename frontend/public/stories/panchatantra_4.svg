<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPan4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPan4)"/>

  <!-- Happy Jackal Feasting -->
  <g transform="translate(680, 250)">
    <circle cx="120" cy="120" r="140" fill="#f59e0b" opacity="0.2"/>
    <!-- Jackal Face -->
    <circle cx="120" cy="100" r="50" fill="#d97706"/>
    <!-- Smiling Mouth -->
    <path d="M100 120 Q120 150 140 120" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Food Basket -->
    <rect x="20" y="220" width="200" height="100" rx="15" fill="#b45309"/>
    <circle cx="60" cy="210" r="25" fill="#ef4444"/>
    <circle cx="120" cy="200" r="30" fill="#eab308"/>
    <circle cx="170" cy="210" r="22" fill="#22c55e"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 4: Rewarding Feast</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#34d399" text-anchor="middle">பயந்து ஓடாமல் ஆராய்ந்ததால் சுவையான உணவை அடைந்து மகிழ்தல்</text>
</svg>
