<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPan3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPan3)"/>

  <!-- War Drum beneath Banyan Tree -->
  <g transform="translate(650, 250)">
    <!-- Banyan Tree Trunk -->
    <path d="M-150 0 L-100 450 H450 L400 0 Z" fill="#291206"/>
    <!-- Large War Drum -->
    <ellipse cx="150" cy="300" rx="140" ry="100" fill="#b45309" stroke="#f59e0b" stroke-width="10"/>
    <ellipse cx="150" cy="300" rx="110" ry="70" fill="#fef08a" opacity="0.9"/>
    <!-- Swaying Branch Hitting Drum -->
    <path d="M-100 80 Q100 180 140 230" stroke="#78350f" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 3: The Abandoned War Drum</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">காற்றில் மரக்கிளைகள் பழைய போர் முரசில் மோதியதால் ஒலி எழுந்தது என அறிதல்</text>
</svg>
