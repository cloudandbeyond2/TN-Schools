<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 1920px; height: 1080px; overflow: hidden; background: #020617; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
</style>
</head>
<body>
  <canvas id="cv" width="1920" height="1080"></canvas>
  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    // Draw Background Sky Gradient
    const skyG = ctx.createLinearGradient(0, 0, 0, 1080);
    skyG.addColorStop(0, '#0f172a');
    skyG.addColorStop(0.5, '#1e1b4b');
    skyG.addColorStop(1, '#0f766e');
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, 1920, 1080);

    // Draw Moon Glow
    const moonG = ctx.createRadialGradient(1600, 200, 20, 1600, 200, 300);
    moonG.addColorStop(0, 'rgba(254, 240, 138, 1)');
    moonG.addColorStop(0.3, 'rgba(251, 191, 36, 0.4)');
    moonG.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = moonG;
    ctx.beginPath();
    ctx.arc(1600, 200, 300, 0, Math.PI * 2);
    ctx.fill();

    // Draw Moon Body
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(1600, 200, 70, 0, Math.PI * 2);
    ctx.fill();

    // Ground Mud
    const mudG = ctx.createLinearGradient(0, 750, 0, 1080);
    mudG.addColorStop(0, '#271006');
    mudG.addColorStop(1, '#0f0502');
    ctx.fillStyle = mudG;
    ctx.fillRect(0, 750, 1920, 330);

    // Raindrops
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 300; i++) {
      const x = Math.random() * 2100 - 100;
      const y = Math.random() * 1080;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 40, y + 120);
      ctx.stroke();
    }
  </script>
</body>
</html>
