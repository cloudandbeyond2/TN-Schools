<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKal3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgKal3)"/>

  <!-- Radiant Sun & Fluffy Clouds -->
  <circle cx="800" cy="180" r="120" fill="#fef08a" opacity="0.9" shadow="0 0 40px #f59e0b"/>

  <!-- Bird Soaring High with Wings Spread -->
  <g transform="translate(740, 220)">
    <path d="M60 60 Q120 0 180 60 Q120 40 60 60 Z" fill="#ffffff"/>
    <path d="M-60 60 Q0 0 60 60 Q0 40 -60 60 Z" fill="#ffffff"/>
    <circle cx="0" cy="50" r="18" fill="#d97706"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 3: Soaring into the Blue Sky</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#bae6fd" text-anchor="middle">5 நாட்களுக்குப் பின் குணமாகிய குருவி வானில் உயரே பறந்து மகிழ்தல்</text>
</svg>
