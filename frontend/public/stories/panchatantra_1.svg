<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPan1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgPan1)"/>

  <!-- Soundwaves echoing DHOOM DHOOM -->
  <circle cx="800" cy="350" r="180" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4"/>
  <circle cx="800" cy="350" r="280" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.2"/>
  
  <text x="800" y="320" font-family="sans-serif" font-size="72" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="4">DHOOM! DHOOM!</text>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.95"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 1: Booming Thunder in the Forest</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#34d399" text-anchor="middle">காட்டில் எழுப்பப்பட்ட பயங்கர 'டூம்!' ஒலியைக் கேட்டு காட்டு விலங்குகள் பயந்து நடுங்குதல்</text>
</svg>
