<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRaman1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRaman1)"/>

  <!-- Sunbeam Beam coming from window -->
  <polygon points="0,0 400,0 800,450 650,450" fill="rgba(255,255,255,0.3)" />

  <!-- Glass Triangular Prism -->
  <g transform="translate(700, 350)">
    <polygon points="100,20 180,180 20,180" fill="rgba(255,255,255,0.25)" stroke="#ffffff" stroke-width="4"/>
    <polygon points="100,20 180,180 140,200 60,200" fill="rgba(255,255,255,0.1)" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- 7-Color Rainbow VIBGYOR Spectrum Beam Emerging -->
  <g transform="translate(850, 470)">
    <path d="M0 0 L650 150 L650 290 L0 0 Z" fill="none"/>
    <line x1="0" y1="0" x2="650" y2="150" stroke="#7c3aed" stroke-width="12"/>
    <line x1="0" y1="0" x2="650" y2="175" stroke="#4f46e5" stroke-width="12"/>
    <line x1="0" y1="0" x2="650" y2="200" stroke="#0284c7" stroke-width="12"/>
    <line x1="0" y1="0" x2="650" y2="225" stroke="#10b981" stroke-width="12"/>
    <line x1="0" y1="0" x2="650" y2="250" stroke="#eab308" stroke-width="12"/>
    <line x1="0" y1="0" x2="650" y2="275" stroke="#f97316" stroke-width="12"/>
    <line x1="0" y1="0" x2="650" y2="300" stroke="#ef4444" stroke-width="12"/>
  </g>

  <!-- Young Raman Schoolboy silhouette (Left) -->
  <g transform="translate(350, 320)">
    <circle cx="80" cy="70" r="45" fill="#f59e0b"/>
    <path d="M20 150 Q80 110 140 150 L160 380 Q80 400 0 380 Z" fill="#ffffff"/>
    <path d="M140 150 L320 80" stroke="#f59e0b" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Banner -->
  <rect x="0" y="780" width="1600" height="120" fill="#020617" opacity="0.9"/>
  <text x="800" y="830" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Scene 1: Prism &amp; Rainbow Light</text>
  <text x="800" y="870" font-family="sans-serif" font-size="22" fill="#38bdf8" text-anchor="middle">சிறுவன் ராமன் ப்ரிஸத்தில் சூரிய ஒளி வானவில்லாகப் பிரிவதைக் கவனித்தல்</text>
</svg>
